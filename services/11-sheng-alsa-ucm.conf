monitor.alsa.rules = [
  { matches = [{ device.name = "alsa_card.platform-sound" }]
    actions.update-props = { api.alsa.use-acp = false api.alsa.use-ucm = true } }
  { matches = [{ node.name = "alsa_output.platform-sound.playback.0.0" }]
    actions.update-props = { node.description = "Speakers" node.nick = "Speakers"
      audio.channels = 2 audio.position = [ FL FR ]
      priority.driver = 1200 priority.session = 1200 } }
  { matches = [{ node.name = "alsa_output.platform-sound.playback.1.0" }]
    actions.update-props = { node.description = "Headphones" node.nick = "Headphones"
      audio.channels = 2 audio.position = [ FL FR ]
      priority.driver = 1100 priority.session = 1100 } }
  { matches = [{ node.name = "alsa_output.platform-sound.playback.3.0" }]
    actions.update-props = { node.description = "DisplayPort"
      priority.driver = 100 priority.session = 100 } }
  { matches = [{ node.name = "alsa_input.platform-sound.capture.2.0" }]
    actions.update-props = { node.description = "Built-in Microphones"
      audio.channels = 2 audio.position = [ FL FR ]
      priority.driver = 1200 priority.session = 1200 } }
]
