name: Guix EFI bundle
on:
  push:
    branches: [boot-chain]
    paths: [".github/workflows/efi.yml", "images/efi-tty.scm", "scripts/build-efi.sh", "packages/u-boot/guix-efi.env"]
  workflow_dispatch:
    inputs:
      layout:
        description: Existing root partition layout
        type: choice
        default: dual
        options: [single, dual]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fdisk dosfstools mtools e2fsprogs android-sdk-libsparse-utils zstd
          wget https://guix.gnu.org/install.sh -O /tmp/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
      - uses: ./.github/actions/guix-pull
      - name: Build sheng firmware before the kernel
        run: '"$GUIX" build -L . -e "(@ (packages firmware) sheng-firmware)"'
      - uses: ./.github/actions/sheng-kernel
      - name: Build GRUB EFI, root filesystem and U-Boot
        env:
          LAYOUT: ${{ inputs.layout || 'dual' }}
        run: scripts/build-efi.sh "$LAYOUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-guix-efi-${{ inputs.layout || 'dual' }}
          path: efi-bundle/
          if-no-files-found: error
          compression-level: 0
