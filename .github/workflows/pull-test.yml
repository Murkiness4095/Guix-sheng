name: pull-test
on:
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zstd
          wget https://guix.gnu.org/install.sh -O /tmp/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
      - uses: ./.github/actions/guix-pull
      - name: Evaluate the standalone sheng sample
        run: |
          "$GUIX" time-machine -C examples/minimal/channels.scm -- \
            system build --dry-run examples/minimal/system.scm
