name: build-dual
on:
  push:
    branches: [main]
    paths: ["images/**", "sheng/**", "packages/**", "modules/**", "services/**", ".guix-channel", "scripts/**", "channels.scm", ".github/actions/guix-store-cache/**", ".github/actions/guix-pull/**", ".github/actions/sheng-kernel/**", ".github/workflows/build-dual.yml"]
  pull_request:
    paths: ["images/**", "sheng/**", "packages/**", "modules/**", "services/**", ".guix-channel", "scripts/**", "channels.scm", ".github/actions/guix-store-cache/**", ".github/actions/guix-pull/**", ".github/actions/sheng-kernel/**", ".github/workflows/build-dual.yml"]
  workflow_dispatch:
    inputs:
      image:
        description: Build an install image, or export only the TTY system closure
        type: choice
        default: none
        options: [none, tty, niri, kde, gnome]
      auto_login:
        description: Log in automatically at boot
        type: boolean
        default: true
      vendor_services:
        description: Enable experimental sheng touch, audio and sensor services
        type: boolean
        default: true
      desktop_username:
        description: Login name for the selected root image
        default: sheng
      desktop_password:
        description: Login password for the selected root image (visible in run metadata)
        default: sheng
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget parted dosfstools mtools e2fsprogs android-sdk-libsparse-utils zstd
          wget https://guix.gnu.org/install.sh -O /tmp/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
      - name: Install archive signing key
        env:
          SIGNING_KEY: ${{ secrets.GUIX_ARCHIVE_SIGNING_KEY }}
          SIGNING_KEY_PUB: ${{ secrets.GUIX_ARCHIVE_SIGNING_KEY_PUB }}
        run: |
          if [[ -n "${SIGNING_KEY:-}" && -n "${SIGNING_KEY_PUB:-}" ]]; then
            printf '%s\n' "$SIGNING_KEY" | sudo install -m 600 /dev/stdin /etc/guix/signing-key.sec
            printf '%s\n' "$SIGNING_KEY_PUB" | sudo install -m 644 /dev/stdin /etc/guix/signing-key.pub
          fi
      - name: Check boot.img layout
        run: python3 tests/bootimg-v2.py
      - name: Write build-time identity settings
        env:
          UNAME: ${{ inputs.desktop_username }}
          VENDOR_SERVICES: ${{ github.event_name != 'workflow_dispatch' || inputs.vendor_services }}
          AUTO_LOGIN: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_login }}
          UPASS: ${{ inputs.desktop_password }}
        run: |
          uname=${UNAME:-sheng}; pass=${UPASS:-sheng}
          hash=$(openssl passwd -6 "$pass")
          printf '(define sheng-desktop-username "%s")\n(define sheng-desktop-password-hash "%s")\n' "$uname" "$hash" > images/settings.scm
          auto_login='#f'
          if [[ "$AUTO_LOGIN" == true ]]; then auto_login='#t'; fi
          printf '(define sheng-desktop-auto-login? %s)\n' "$auto_login" >> images/settings.scm
          vendor_services='#f'
          if [[ "$VENDOR_SERVICES" == true ]]; then vendor_services='#t'; fi
          printf '(define sheng-enable-vendor-services? %s)\n' "$vendor_services" >> images/settings.scm
      - name: Restore Guix state
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/guix
            ~/.config/guix
          key: guix-state-${{ hashFiles('channels.scm') }}
      - uses: ./.github/actions/guix-pull
      - name: Save Guix state
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/guix
            ~/.config/guix
          key: guix-state-${{ hashFiles('channels.scm') }}
      - name: Check the greeter package used by the desktop service
        if: ${{ inputs.image == 'niri' || github.event_name != 'workflow_dispatch' }}
        run: |
          bash scripts/seed-noctalia-greeter.sh
          "$GUIX" build -e '(@ (midnight packages noctalia-greeter) noctalia-greeter)'
      - name: Build U-Boot boot.img
        run: |
          scripts/build-uboot.sh dual
      - name: Evaluate all images
        run: |
          set -o pipefail
          for img in $(echo "$IMAGES"); do
            echo "=== eval $img ==="
            "$GUIX" system image -L . --dry-run "images/$img.scm" 2>&1 | tail -20 || exit 1
          done
        env:
          IMAGES: ${{ inputs.image && inputs.image != 'none' && format('dual-{0}', inputs.image) || 'dual-tty dual-niri dual-kde dual-gnome' }}
      - name: Build sheng firmware before the kernel
        run: '"$GUIX" build -L . -e "(@ (packages firmware) sheng-firmware)"'
      - uses: ./.github/actions/sheng-kernel
      - uses: ./.github/actions/guix-store-cache
        id: store
        with:
          layout: dual
          variant: ${{ inputs.image != 'none' && inputs.image || 'tty' }}
      - name: Build system closure
        id: system-closure
        env:
          DESKTOP: ${{ inputs.image != 'none' && inputs.image || 'tty' }}
        run: |
          cat > images/ci-system.scm <<EOF
          (load "$GITHUB_WORKSPACE/images/base.scm")
          (sheng-os #:desktop '$DESKTOP #:root-label "linux")
          EOF
          set -o pipefail
          "$GUIX" system build --verbosity=2 -L . images/ci-system.scm \
            2>&1 > ci-system.path | tee system-build.err >&2
      - name: Collect system build diagnostics
        if: ${{ failure() && steps.system-closure.outcome == 'failure' }}
        run: |
          mkdir -p diagnostics
          cp system-build.err diagnostics/
          df -h > diagnostics/disk.txt
          free -h > diagnostics/memory.txt
          sudo dmesg > diagnostics/kernel.txt 2>&1 || true
          sudo find /var/log/guix/drvs -name '*webkitgtk*.drv.gz' \
            -exec cp {} diagnostics/ \;
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.system-closure.outcome == 'failure' }}
        with:
          name: sheng-dual-system-build-diagnostics
          path: diagnostics/
          retention-days: 7
      - name: Build all dual-system images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image != 'none' }}
        run: |
          set -e
          for img in $IMAGES; do
            echo "=== $img ==="
            scripts/build-image.sh "images/$img.scm" || echo "FAILED: $img" | tee -a failures.txt
          done
          test ! -s failures.txt
        env:
          IMAGES: ${{ inputs.image && format('dual-{0}', inputs.image) || 'dual-tty' }}
      - name: Export built store closure
        id: store-export
        if: ${{ !cancelled() && steps.system-closure.outcome == 'success' && steps.store.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          systems=("$(tail -n 1 ci-system.path)")
          for img in $IMAGES; do
            if [[ -s "$img.system" ]]; then systems+=("$(cat "$img.system")"); fi
          done
          scripts/store-cache-export.sh "$RUNNER_TEMP/sheng-store" "${systems[@]}"
        env:
          IMAGES: ${{ inputs.image && format('dual-{0}', inputs.image) || 'dual-tty' }}
      - name: Save built store closure
        if: ${{ !cancelled() && steps.store-export.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sheng-store
          key: ${{ steps.store.outputs.cache-primary-key }}
      - name: Export store closures
        run: |
          set -euo pipefail
          sudo test -f /etc/guix/signing-key.sec || sudo "$GUIX" archive --generate-key
          mkdir -p closures
          for img in $IMAGES; do
            system=$(tail -n 1 ci-system.path)
            if [[ -s "$img.system" ]]; then system=$(cat "$img.system"); fi
            scripts/export-closure.sh "$system" "closures/$img.nar.zst" > "closures/$img.system"
          done
          profile=$(dirname "$(dirname "$GUIX")")
          test -d "$profile" || { echo "no Guix profile at $profile" >&2; exit 1; }
          "$GUIX" archive --export -r "$profile" | zstd -T0 -o "closures/guix-$(basename "$profile").nar.zst"
          sudo cat /etc/guix/signing-key.pub > closures/signing-key.pub
          (cd closures && sha256sum ./*.nar.zst > SHA256SUMS)
          ls -lh closures
        env:
          IMAGES: ${{ inputs.image && format('dual-{0}', inputs.image) || 'dual-tty' }}
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: sheng-dual-closures
          path: closures/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.image != 'none' }}
        with:
          name: sheng-dual-images
          path: |
            sheng-boot-dual.img
            *.sparse.img
            failures.txt
            *.err
