name: build-single
on:
  push:
    branches: [main]
    paths: ["images/**", "sheng/**", "packages/**", "modules/**", "services/**", ".guix-channel", "scripts/**", "channels.scm", ".github/actions/guix-pull/**", ".github/actions/sheng-kernel/**", ".github/workflows/build-single.yml"]
  pull_request:
    paths: ["images/**", "sheng/**", "packages/**", "modules/**", "services/**", ".guix-channel", "scripts/**", "channels.scm", ".github/actions/guix-pull/**", ".github/actions/sheng-kernel/**", ".github/workflows/build-single.yml"]
  workflow_dispatch:
    inputs:
      image:
        description: Image variant (none builds only boot.img)
        type: choice
        default: tty
        options: [none, tty, niri, kde, gnome]
      auto_login:
        description: Log in automatically at boot
        type: boolean
        default: true
      vendor_services:
        description: Enable experimental sheng touch, audio and sensor services
        type: boolean
        default: false
      desktop_username:
        description: Login name for the selected root image
        default: sheng
      desktop_password:
        description: Login password for the selected root image
        default: sheng
      export_closures:
        description: Export signed store closures for offline generation updates
        type: boolean
        default: true
jobs:
  images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget parted dosfstools mtools e2fsprogs android-sdk-libsparse-utils zstd
          wget https://guix.gnu.org/install.sh -O /tmp/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
      - name: Install archive signing key
        env:
          SIGNING_KEY: ${{ secrets.GUIX_ARCHIVE_SIGNING_KEY }}
          SIGNING_KEY_PUB: ${{ secrets.GUIX_ARCHIVE_SIGNING_KEY_PUB }}
        run: |
          if [[ -n "${SIGNING_KEY:-}" && -n "${SIGNING_KEY_PUB:-}" ]]; then
            printf '%s\n' "$SIGNING_KEY" | sudo install -m 600 /dev/stdin /etc/guix/signing-key.sec
            printf '%s\n' "$SIGNING_KEY_PUB" | sudo install -m 644 /dev/stdin /etc/guix/signing-key.pub
          fi
      - name: Check boot.img layout
        run: python3 tests/bootimg-v2.py
      - name: Write build-time identity settings
        env:
          UNAME: ${{ inputs.desktop_username }}
          VENDOR_SERVICES: ${{ inputs.vendor_services }}
          AUTO_LOGIN: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_login }}
          UPASS: ${{ inputs.desktop_password }}
        run: |
          uname=${UNAME:-sheng}; pass=${UPASS:-sheng}
          hash=$(openssl passwd -6 "$pass")
          printf '(define sheng-desktop-username "%s")\n(define sheng-desktop-password-hash "%s")\n' "$uname" "$hash" > images/settings.scm
          auto_login='#f'
          if [[ "$AUTO_LOGIN" == true ]]; then auto_login='#t'; fi
          printf '(define sheng-desktop-auto-login? %s)\n' "$auto_login" >> images/settings.scm
          vendor_services='#f'
          if [[ "$VENDOR_SERVICES" == true ]]; then vendor_services='#t'; fi
          printf '(define sheng-enable-vendor-services? %s)\n' "$vendor_services" >> images/settings.scm
      - name: Restore Guix state
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/guix
            ~/.config/guix
          key: guix-state-${{ hashFiles('channels.scm') }}
      - uses: ./.github/actions/guix-pull
      - name: Check the greeter package used by the desktop service
        if: ${{ inputs.image == 'niri' || github.event_name != 'workflow_dispatch' }}
        run: |
          bash scripts/seed-noctalia-greeter.sh
          "$GUIX" build -e '(@ (midnight packages noctalia-greeter) noctalia-greeter)'
      - name: Check store registration with the pinned Guix
        if: ${{ inputs.image != 'none' }}
        run: |
          fixture=$(mktemp -d)
          item=/gnu/store/00000000000000000000000000000000-sheng-registration-check
          mkdir -p "$fixture/gnu/store" "$fixture/var/guix/db"
          printf 'fixture\n' > "$fixture$item"
          printf '%s\n\n0\n' "$item" > "$fixture/graph"
          "$GUIX" repl scripts/register-image-closures.scm "$fixture" "$fixture/graph"
          python3 - "$fixture/var/guix/db/db.sqlite" "$item" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database, item = sys.argv[1:]
          with sqlite3.connect(Path(database).as_uri() + "?mode=ro", uri=True) as conn:
              if not conn.execute("SELECT 1 FROM ValidPaths WHERE path = ?", (item,)).fetchone():
                  sys.exit("Fixture was not registered")
          PY
      - name: Build U-Boot boot.img
        run: |
          scripts/build-uboot.sh single
      - name: Evaluate all images
        if: ${{ inputs.image != 'none' }}
        run: |
          set -o pipefail
          for img in $(echo "$IMAGES"); do
            echo "=== eval $img ==="
            "$GUIX" system image -L . --dry-run "images/$img.scm" 2>&1 | tail -20 || exit 1
          done
        env:
          IMAGES: ${{ inputs.image && format('single-{0}', inputs.image) || 'single-tty single-kde single-gnome single-niri' }}
      - name: Build sheng firmware before the kernel
        if: ${{ inputs.image != 'none' }}
        run: '"$GUIX" build -L . -e "(@ (packages firmware) sheng-firmware)"'
      - uses: ./.github/actions/sheng-kernel
        if: ${{ inputs.image != 'none' }}
      - name: Build all single-system images
        if: ${{ inputs.image != 'none' }}
        run: |
          set -e
          for img in $IMAGES; do
            echo "=== $img ==="
            scripts/build-image.sh "images/$img.scm" || echo "FAILED: $img" | tee -a failures.txt
          done
          test ! -s failures.txt
        env:
          IMAGES: ${{ inputs.image && format('single-{0}', inputs.image) || 'single-tty single-kde single-gnome single-niri' }}
      - name: Export store closures
        if: ${{ inputs.export_closures && inputs.image != 'none' }}
        run: |
          set -euo pipefail
          sudo test -f /etc/guix/signing-key.sec || sudo "$GUIX" archive --generate-key
          mkdir -p closures
          for img in $IMAGES; do
            scripts/export-closure.sh "$img.ext4" "closures/$img.nar.zst"
          done
          profile=$(dirname "$(dirname "$(readlink -f "$GUIX")")")
          "$GUIX" archive --export -r "$profile" | zstd -T0 -o "closures/guix-$(basename "$profile").nar.zst"
          sudo cat /etc/guix/signing-key.pub > closures/signing-key.pub
          (cd closures && sha256sum ./*.nar.zst > SHA256SUMS)
          ls -lh closures
        env:
          IMAGES: ${{ inputs.image && format('single-{0}', inputs.image) || 'single-tty single-kde single-gnome single-niri' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.export_closures && inputs.image != 'none' }}
        with:
          name: sheng-single-closures
          path: closures/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheng-single-images
          path: |
            sheng-boot.img
            *.sparse.img
            failures.txt
