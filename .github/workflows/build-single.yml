name: build-single
on:
  push:
    branches: [main]
    paths: ["images/**", "scripts/**", "channels.scm", ".github/workflows/build-single.yml"]
  pull_request:
    paths: ["images/**", "scripts/**", "channels.scm", ".github/workflows/build-single.yml"]
  workflow_dispatch:
    inputs:
      desktop_username:
        description: Desktop user name
        default: sheng
      desktop_password:
        description: Desktop user password
        default: sheng
jobs:
  images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget parted dosfstools mtools e2fsprogs android-sdk-libsparse-utils
          wget https://guix.gnu.org/install.sh -O /tmp/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
      - name: Write build-time identity settings
        env:
          UNAME: ${{ inputs.desktop_username }}
          UPASS: ${{ inputs.desktop_password }}
        run: |
          uname=${UNAME:-sheng}; pass=${UPASS:-sheng}
          hash=$(openssl passwd -6 "$pass")
          printf '(define desktop-username "%s")\n(define desktop-password-hash "%s")\n' "$uname" "$hash" > images/settings.scm
          cat images/settings.scm
      - name: Cache Guix checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkouts-${{ hashFiles('channels.scm') }}
      - name: Pull pinned channels
        run: guix pull -C channels.scm
      - name: Build all single-system images
        env:
          GUIX: $HOME/.config/guix/current/bin/guix
        run: |
          set -e
          for img in single-tty single-kde single-gnome single-niri single-noctalia; do
            echo "=== $img ==="
            scripts/build-image.sh "images/$img.scm" || echo "FAILED: $img" | tee -a failures.txt
          done
          test ! -s failures.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheng-single-images
          path: |
            *.ext4
            *.sparse.img
            failures.txt
